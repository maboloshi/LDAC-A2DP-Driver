name: build

on:
  # 仅手动触发：Actions 页面 Run workflow，或 gh workflow run build.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------
  # 托管服务 + WPF 配置界面：仓库的目标框架是 net6.0，而 windows-2022 镜像只预装
  # 8/9/10 的 SDK，所以这里显式装 6.0.x。
  # ---------------------------------------------------------------------------
  dotnet:
    name: .NET (service + GUI)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
          # 只缓存 NuGet 包；obj/bin 不缓存（本工作流每次都会先清理）
          cache: true
          cache-dependency-path: |
            src/service/LDACService.csproj
            src/gui/LDACConfigApp.csproj
            src/tests/LDACDriver.Tests.csproj

      # 仓库里误提交了 obj/bin（有些还是原作者机器上的绝对路径），先清掉再还原，
      # 否则增量状态会让 restore/build 用错缓存。
      - name: Clean committed obj/bin
        shell: pwsh
        run: |
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Directory -Include obj, bin -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\\.git\\' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Restore
        shell: pwsh
        run: |
          foreach ($p in @(
            'src/service/LDACService.csproj',
            'src/gui/LDACConfigApp.csproj',
            'src/tests/LDACDriver.Tests.csproj'
          )) {
            dotnet restore $p
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build service
        run: dotnet build src/service/LDACService.csproj -c Release --no-restore

      - name: Build GUI
        run: dotnet build src/gui/LDACConfigApp.csproj -c Release --no-restore

      # 测试项目引用了 LDACManager，但仓库里没有这个类（CS0103），现在必然编译失败。
      # 补齐后把 continue-on-error 删掉即可纳入门禁。
      - name: "Build tests (expected to fail - missing LDACManager)"
        continue-on-error: true
        run: dotnet build src/tests/LDACDriver.Tests.csproj -c Release --no-restore

      - name: Upload app artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ldac-apps-${{ github.sha }}
          if-no-files-found: warn
          path: |
            src/service/bin/Release/**
            src/gui/bin/Release/**

  # ---------------------------------------------------------------------------
  # KMDF 驱动：windows-2022 镜像已预装 WDK + WDK VS 扩展 + 10.0.26100 SDK。
  #
  # 已知的 runner 限制：
  #  * WDK 10.0.26100 只提供 x64/arm64 的 infverif，32 位 MSBuild 会去找不存在的
  #    x86\InfVerif.dll —— 所以这里用 x64 MSBuild。
  #  * 没有代码签名证书，所以 SignMode=Off；同时关掉 inf2cat（catalog 生成），
  #    否则它会因为打包目录里缺 .sys 而失败。需要出 .cat 时请在有证书的环境里
  #    打开 inf2cat 并走签名流程。
  # ---------------------------------------------------------------------------
  driver:
    name: KMDF driver (Release | x64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          # WDK 10.0.26100 只提供 x64/arm64 的 infverif，32 位 MSBuild 会去找不存在的 x86\InfVerif.dll
          msbuild-architecture: x64

      - name: Clean stale incremental state
        shell: pwsh
        run: Remove-Item 'src/driver/build' -Recurse -Force -ErrorAction SilentlyContinue

      # 编译整个 sln 里的 LDACDriver 目标，这样 $(SolutionDir) 才有值，
      # 产物落在 build\Release\driver\。
      - name: Build driver (Release | x64)
        run: msbuild LDACDriver.sln /t:LDACDriver /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:EnableInf2cat=false /m /v:minimal /nologo

      - name: Upload driver artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ldac-driver-${{ github.sha }}
          if-no-files-found: warn
          path: build/Release/driver/**
